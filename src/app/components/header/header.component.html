<header class="header">
  <!-- Header Section: Logo, Category Menu, Search, Wishlist, Account, Cart -->
  <div class="header-top">
    <div class="left-section">
      <div class="logo-section">
        <img src="logo_transp.png" alt="632 Shop Logo" class="logo"/>
      </div>
    </div>

    <div class="center-section">
      <app-category-menu></app-category-menu>
    </div>

    <div class="actions-section">
      <div class="search-component">
        <fa-icon [icon]="searchIcon" class="search-icon"></fa-icon>
        <input
          type="text"
          class="search-input"
          placeholder="Search products..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch(searchQuery)"
        />
      </div>

      <button class="icon-btn wishlist-btn" aria-label="Wishlist">
        <img src="like_icon.svg" alt="Wishlist" class="wishlist-icon"/>
      </button>

      <button class="icon-btn account-btn" aria-label="Account">
        <img src="profile_icon.svg" alt="Account" class="account-icon"/>
      </button>

      <button class="action-btn cart-btn">
        <img src="cart.svg" alt="Cart" class="cart-icon"/>
        <span>Cart</span>
      </button>
    </div>
  </div>
</header>
